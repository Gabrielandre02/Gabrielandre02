name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [feat/metrics]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          filename: metrics.stats.svg
          committer_branch: metrics

      - name: Open source contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          filename: metrics.notable.svg
          committer_branch: metrics
          plugin_notable: yes
          plugin_notable_indepth: yes

  dark-mode:
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metrics
      - name: Add dark mode styles to the SVGs
        run: |
          python3 - <<'PY'
          import pathlib
          css = ("<style>@media (prefers-color-scheme: dark)"
                 "{svg{color:#9198a1}h1,h2,h3{color:#58a6ff}.field svg{fill:#8b949e}}</style>")
          for name in ("metrics.stats.svg", "metrics.notable.svg"):
              path = pathlib.Path(name)
              text = path.read_text()
              if "prefers-color-scheme: dark" not in text:
                  path.write_text(text.replace("</svg>", css + "</svg>", 1) if text.rstrip().endswith("</svg>") else text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.stats.svg metrics.notable.svg
          git diff --cached --quiet || git commit -m "chore: add dark mode styles to metrics SVGs"
          git push
