name: OSS contributions

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [feat/metrics]
    paths: [".contributions.yml", ".github/workflows/oss-contributions.yml"]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CuriousLearner/oss-contributions-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: ".contributions.yml"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update open-source contributions"
          git push
